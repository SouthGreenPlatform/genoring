image: httpd:2.4
profiles: ["prod","staging","dev","backend","offline"]
env_file:
  - ${PWD}/env/genoring_httpd.env
  - ${PWD}/env/genoring_genoring.env
ports:
  - ${GENORING_PORT}:80
volumes:
  - type: bind
    source: ${GENORING_VOLUMES_DIR}/proxy/httpd/genoring-httpd.conf
    target: /usr/local/apache2/conf/httpd.conf
  - ${GENORING_VOLUMES_DIR}/proxy/httpd/includes:/usr/local/apache2/conf/includes
  - ${GENORING_VOLUMES_DIR}/proxy/httpd/genoring:/usr/local/apache2/conf/genoring
  - genoring-drupal-volume:/opt/drupal
  - genoring-www-volume:/usr/share/www
  - genoring-data-volume:/data
# Other services reach the proxy using the "genoring-proxy" name, whatever the
# proxy service used.
networks:
  default:
    aliases:
      - genoring-proxy
restart: always
