# GenoRing Apache HTTPd configuration.
#
# This file is the Apache HTTPd equivalent of the nginx "genoring-fpm.conf"
# file. It replaces the "httpd.conf" file of the proxy container. Environment
# variables (ie. "${HTTPD_PORT}") are resolved by Apache HTTPd at startup from
# the container environment.
#
# Other modules can use 2 directories to extend this configuration:
# - "conf/genoring/*.conf" files are included in the main "GenoRing" virtual
#   host definition (HTTP and HTTPS);
# - "conf/includes/*.conf" files are included at the server level, after the
#   main "GenoRing" virtual host definition.

ServerRoot "/usr/local/apache2"
Listen ${HTTPD_PORT}

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule filter_module modules/mod_filter.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule expires_module modules/mod_expires.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule version_module modules/mod_version.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule macro_module modules/mod_macro.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so

User www-data
Group www-data

ServerAdmin genoring@genoring.net
ServerName ${GENORING_HOST}

# Deny access to the entirety of the server's filesystem.
<Directory />
  AllowOverride None
  Require all denied
</Directory>

# Disable access to .htaccess or .htpasswd files.
<Files ".ht*">
  Require all denied
</Files>

# Logs are sent to the container outputs.
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
# Don't log this kind of information.
SetEnvIf Request_URI "/(?:robots\.txt|favicon\.ico)$" dontlog
CustomLog /proc/self/fd/1 combined env=!dontlog

# Avoid passing HTTP_PROXY environment to proxied backends ("httpoxy").
RequestHeader unset Proxy early

TypesConfig conf/mime.types
AddType application/x-compress .Z
AddType application/x-gzip .gz .tgz

# Global HTTP settings (512m).
LimitRequestBody 536870912
# Allow up to 5 minutes for a script to do its job.
ProxyTimeout 300

SSLRandomSeed startup builtin
SSLRandomSeed connect builtin
SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"

# Main "GenoRing" site definition, used by the HTTP virtual host below and by
# the HTTPS one of the "ssl" module.
<Macro GenoRingSite>
  ServerName ${GENORING_HOST}
  DocumentRoot "/opt/drupal/web"

  # Index files.
  DirectoryIndex index.php index.html

  # Offline mode.
  ErrorDocument 503 /offline.html

  <Directory "/opt/drupal/web">
    # Allow the use of symlinks. No directory listing.
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    # Allow paths after scripts (ie. "/update.php/selection").
    AcceptPathInfo On

    # Enable expirations for static content.
    ExpiresActive On
    ExpiresDefault "access plus 10 years"

    RewriteEngine On

    # Check for offline mode.
    RewriteCond /opt/drupal/web/offline.html -f
    RewriteRule !^offline\.html$ - [R=503,L]

    # Disable access to any .* files like .htaccess or .htpasswd etc.
    RewriteRule (?:^|/)\. - [F]
    # Disable access to any swap file (ending with ~) for edited files.
    RewriteRule ~$ - [F]
    # Deny running scripts inside writable directories.
    RewriteRule (?:^|/)(?:images|cache|media|logs|tmp|files)/.*\.(?:php|pl|py|jsp|asp|sh|cgi|pm|inc|module)$ - [NC,F]

    # Serve compressed CSS and JS files if they exist and the client accepts
    # gzip.
    RewriteCond %{HTTP:Accept-Encoding} gzip
    RewriteCond %{REQUEST_FILENAME}.gz -s
    RewriteRule ^(.+\.(?:css|js))$ $1.gz [QSA]
    RewriteRule \.css\.gz$ - [T=text/css,E=no-gzip:1]
    RewriteRule \.js\.gz$ - [T=text/javascript,E=no-gzip:1]
    <FilesMatch "\.(?:css|js)\.gz$">
      Header set Content-Encoding gzip
      Header append Vary Accept-Encoding
    </FilesMatch>

    # Drupal8+: Only allow php script in root and core directories. Other php
    # files will be handled by Drupal.
    # Note: CONTEXT_PREFIX holds the site base path when it is served under a
    # sub-path (see "genoring/base-path.conf").
    RewriteCond %{REQUEST_FILENAME} \.php$
    RewriteCond %{REQUEST_FILENAME} !^/opt/drupal/web/(?:index|update|autoload|core/[^/]+)\.php$
    RewriteRule ^ %{CONTEXT_PREFIX}/index.php [L]

    # Check if the requested file exists or if it is a directory where the
    # index file should be checked. Otherwise, have Drupal handle the request.
    # The original request URI lets Drupal know the requested path and its base
    # path (when served under a sub-path).
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} !/favicon\.ico$
    RewriteRule ^ %{CONTEXT_PREFIX}/index.php [L]

    <FilesMatch "\.php$">
      # No caching for PHP output.
      ExpiresActive Off
      # "/opt/drupal/web/" is the path to Drupal files in the Drupal container.
      SetHandler "proxy:fcgi://${COMPOSE_PROJECT_NAME}:9000"
      # Allow larger files for data managed by GenoRing.
      # @todo Only allow large uploads on genoring forms.
      ProxyFCGISetEnvIf "true" PHP_VALUE "upload_max_filesize=4G"
      ProxyFCGISetEnvIf "true" PHP_ADMIN_VALUE "post_max_size=4G"
    </FilesMatch>
  </Directory>

  # Include GenoRing module configs.
  IncludeOptional conf/genoring/*.conf
</Macro>

<VirtualHost *:${HTTPD_PORT}>
  Use GenoRingSite
</VirtualHost>

IncludeOptional conf/includes/*.conf
